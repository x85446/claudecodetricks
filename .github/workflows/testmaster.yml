# testmaster on the three OSes it ships for. The Windows job is the only
# place its Job Object tree kill, LockFileEx run lock and shell resolution
# run for real.
name: testmaster

on:
  push:
    branches: [main]
    paths: ['src/internal/testmaster/**', 'src/cmd/testmaster/**', 'go.mod', '.github/workflows/testmaster.yml']
  pull_request:
    branches: [main]
    paths: ['src/internal/testmaster/**', 'src/cmd/testmaster/**', 'go.mod', '.github/workflows/testmaster.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        # Windows checkouts convert to CRLF, which gofmt reports; the format is
        # the same on every OS, so Linux checks it.
        if: matrix.os == 'ubuntu-24.04'
        run: test -z "$(gofmt -l src/internal/testmaster src/cmd/testmaster)"
      - name: vet
        run: go vet ./src/internal/testmaster/... ./src/cmd/testmaster/...
      - name: test
        run: go test -count=1 -v ./src/internal/testmaster/... ./src/cmd/testmaster/...
      - name: cross-build
        if: matrix.os == 'ubuntu-24.04'
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./src/cmd/testmaster
            echo "built $target"
          done
