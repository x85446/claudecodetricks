[package]
name    = "reconcile-identities"
version = "0.1.0"
edition = "2021"

[lib]
name = "reconcile_identities"
path = "src/lib.rs"

[[bin]]
name = "reconcile-identities"
path = "src/main.rs"

[features]
default = []
test-support = []

[dependencies]
agent-comms-core = { path = "../../../../crates/agent-comms-core" }
agent-comms-cfg  = { path = "../../../../crates/agent-comms-cfg" }
serde            = { workspace = true }
serde_json       = { workspace = true }
serde_yaml       = { workspace = true }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
clap             = { workspace = true }
jiff             = { workspace = true }
sha2             = { workspace = true }
hex              = { workspace = true }
ed25519-dalek    = { workspace = true }
rand             = { workspace = true }
rand_core        = { workspace = true }
indexmap         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
