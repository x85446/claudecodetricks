# Skills owned by another repository, not by this one.
#
# sync-all.sh resolves a skill's source in this order:
#   1. skills/<name>/                    -- this repo's canonical backup
#   2. an entry below                    -- a skill owned by its own project
#   3. ~/.claude/skills/<name>/          -- the live global install (last resort)
#
# Without an entry here, an externally-owned skill falls through to (3) and gets
# ported from whatever is currently installed. That is a real hazard: the global
# install is a COPY, refreshed only when the owning repo's installer is re-run.
# izmachine's install sat 3 days and 115 lines behind its own repo, and the
# first Codex port was built from the stale copy.
#
# Format: <skill-name> <absolute path to the directory holding SKILL.md>
# ~ is expanded. Lines starting with # are ignored.

izmachine  ~/workspace/izuma/izmachine/skills/izmachine
