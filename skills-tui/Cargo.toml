[package]
name = "skills-tui"
version = "0.1.0"
edition = "2021"
description = "TUI for managing skill→project mappings (parallel to skillinstall.sh)"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
dirs = "5"
serde_yaml = "0.9"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
